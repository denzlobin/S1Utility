name: Release

# Fires when a tag matching `v*` is pushed (e.g. v0.1.0, v1.2.3-beta).
# Builds + tests on each platform, then publishes self-contained Windows x64
# and Linux x64 artifacts attached to a single GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # softprops/action-gh-release needs this to create the Release

# Opt JavaScript actions (checkout, setup-dotnet, action-gh-release) onto Node 24
# ahead of the 2026-06-02 default flip; Node 20 is removed from runners 2026-09-16.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET SDK pinned by global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Extract version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release --nologo --verbosity normal

      - name: Publish (Windows x64, self-contained)
        run: >
          dotnet publish S1Utility/S1Utility.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/S1Utility-${{ steps.ver.outputs.version }}-win-x64

      - name: Package zip
        shell: pwsh
        run: |
          $name = "S1Utility-${{ steps.ver.outputs.version }}-win-x64"
          Compress-Archive -Path "publish/$name/*" -DestinationPath "publish/$name.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: publish/S1Utility-${{ steps.ver.outputs.version }}-win-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET SDK pinned by global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release --nologo --verbosity normal

      - name: Publish (Linux x64, self-contained single file)
        run: >
          dotnet publish S1Utility/S1Utility.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output publish/S1Utility-${{ steps.ver.outputs.version }}-linux-x64

      - name: Package tarball
        run: |
          name="S1Utility-${{ steps.ver.outputs.version }}-linux-x64"
          chmod +x "publish/$name/S1Utility"
          tar --owner=0 --group=0 \
            --exclude='*.pdb' --exclude='*.dll' --exclude='*.dylib' \
            -czf "publish/$name.tar.gz" -C "publish/$name" .

      - name: Package AppImage
        run: |
          ver="${{ steps.ver.outputs.version }}"
          src="publish/S1Utility-${ver}-linux-x64"
          appdir="publish/AppDir"

          mkdir -p "$appdir/usr/bin" \
                   "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/256x256/apps"

          cp -r "$src/." "$appdir/usr/bin/"
          # Drop the Windows/macOS DryWetMidi natives and debug symbols; the
          # Linux build uses the ALSA backend, so they are dead weight here.
          rm -f "$appdir/usr/bin/"*.pdb "$appdir/usr/bin/"*.dll "$appdir/usr/bin/"*.dylib
          chmod +x "$appdir/usr/bin/S1Utility"

          cp S1Utility/Assets/icon-256.png "$appdir/S1Utility.png"
          cp S1Utility/Assets/icon-256.png "$appdir/usr/share/icons/hicolor/256x256/apps/S1Utility.png"

          cat > "$appdir/S1Utility.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=S1Utility
          Comment=Editor and patch utility for the Roland S-1
          Exec=S1Utility
          Icon=S1Utility
          Categories=AudioVideo;Audio;
          Terminal=false
          DESKTOP
          cp "$appdir/S1Utility.desktop" "$appdir/usr/share/applications/S1Utility.desktop"

          cat > "$appdir/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/S1Utility" "$@"
          APPRUN
          chmod +x "$appdir/AppRun"

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$appdir" "publish/S1Utility-${ver}-x86_64.AppImage"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            publish/S1Utility-${{ steps.ver.outputs.version }}-linux-x64.tar.gz
            publish/S1Utility-${{ steps.ver.outputs.version }}-x86_64.AppImage

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: true
