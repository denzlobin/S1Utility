name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt JavaScript actions (checkout, setup-dotnet) onto Node.js 24 ahead of the
# 2026-06-02 default flip; Node 20 is being removed from runners 2026-09-16.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK pinned by global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --nologo --verbosity normal

      - name: Short commit SHA
        id: sha
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish (Windows x64, self-contained)
        run: >
          dotnet publish S1Utility/S1Utility.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/S1Utility-${{ steps.sha.outputs.short }}-win-x64

      - name: Package zip
        shell: pwsh
        run: |
          $name = "S1Utility-${{ steps.sha.outputs.short }}-win-x64"
          Compress-Archive -Path "publish/$name/*" -DestinationPath "publish/$name.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: S1Utility-${{ steps.sha.outputs.short }}-win-x64
          path: publish/S1Utility-${{ steps.sha.outputs.short }}-win-x64.zip
          retention-days: 30
          if-no-files-found: error
