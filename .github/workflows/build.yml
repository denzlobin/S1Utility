name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt JavaScript actions (checkout, setup-dotnet) onto Node.js 24 ahead of the
# 2026-06-02 default flip; Node 20 is being removed from runners 2026-09-16.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK pinned by global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --nologo --verbosity normal
